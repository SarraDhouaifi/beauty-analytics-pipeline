version: 2

models:
  - name: stg_products
    description: Cleaned product catalogue
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: price_usd
        tests: [not_null]

  - name: stg_reviews
    description: Cleaned reviews with sentiment
    columns:
      - name: review_id
        tests: [unique, not_null]
      - name: rating
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: sentiment_label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["positive", "neutral", "negative"]

  - name: dim_products
    description: Product dimension with review KPIs
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: fct_reviews
    description: Review fact table (one row per review)
    columns:
      - name: review_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: mart_brand_performance
    description: Brand scorecard
    columns:
      - name: brand_name
        tests: [unique, not_null]

  - name: mart_category_summary
    description: Category x price band summary

  - name: mart_monthly_reviews
    description: Monthly review trend by category
